    <style>
        :root {
            --vta-main: #1a237e; /* Navy Blue */
            --vta-gold: #ffc107; /* Gold */
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            background-color: #e9ecef;
            background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .vta-nav {
            background: var(--vta-main);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 5px solid var(--vta-gold);
        }

        .container-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .search-card {
            background: var(--glass);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            border: 1px solid #dee2e6;
        }

        .card-inner {
            padding: clamp(20px, 5vw, 50px);
        }

        .vta-header h2 {
            color: var(--vta-main);
            font-weight: 800;
            text-transform: uppercase;
        }

        .input-group-vta {
            display: flex;
            gap: 0;
            margin-top: 30px;
        }

        .vta-input {
            border: 2px solid #ced4da;
            padding: 15px 20px;
            border-radius: 12px 0 0 12px;
            font-size: 1.1rem;
            width: 100%;
        }

        .vta-btn {
            background: var(--vta-main);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 0 12px 12px 0;
            font-weight: 700;
            transition: 0.3s;
        }

        .vta-btn:hover { background: #0d124a; }

        .res-box {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border-left: 8px solid var(--vta-main);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .res-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
        }

        .res-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #212529;
            margin-bottom: 15px;
        }
        
        .res-value.small-font {
            font-size: 1rem;
            font-weight: 500;
        }

        .instructor-footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #dee2e6;
            font-weight: 600;
            color: #495057;
        }

        .inst-highlight { color: var(--vta-main); text-decoration: underline; }

        @media (max-width: 576px) {
            .input-group-vta { flex-direction: column; }
            .vta-input { border-radius: 12px; margin-bottom: 10px; }
            .vta-btn { border-radius: 12px; padding: 15px; }
            .card-inner { padding: 20px; }
        }
    </style>
</head>

<div class="vta-nav">

</div>

                </div>
            </div>

            <div id="output" class="mt-4">

            </div>
        </div>

        <div class="instructor-footer">

        </div>
    </div>
</div>

    function getStatusBadge(status) {
        let badgeClass = 'bg-secondary';
        switch (status.trim().toLowerCase()) {
            case 'complete': badgeClass = 'bg-success'; break;
            case 'following': badgeClass = 'bg-primary'; break;
            case 'participation': badgeClass = 'bg-info text-dark'; break;
            case 'not complete': badgeClass = 'bg-warning text-dark'; break;
            case 'drop out': badgeClass = 'bg-danger'; break;
        }
        return `<span class="badge ${badgeClass} p-2 px-3">${status}</span>`;
    }

    function searchStudent() {
        const nicInput = document.getElementById('nicInput');
        const val = nicInput.value.trim().toUpperCase();
        const area = document.getElementById('output');
        
        area.innerHTML = `<div class="alert alert-info text-center">Searching...</div>`;

        setTimeout(() => {
            // **FIX**: Use .filter() to find ALL matching records, not just the first one.
            const results = trainees.filter(s => s["NIC"].trim().toUpperCase() === val);

            if (results.length > 0) {
                let html = `<h5>Found ${results.length} record(s) for NIC: ${val}</h5>`;
                
                // Loop through each result and create a display box for it
                results.forEach(s => {
                    html += `
                        <div class="res-box animate__animated animate__fadeIn">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="res-label">Trainee Name</div>
                                    <div class="res-value text-primary" style="font-size: 1.4rem;">${s["Name With Initials"]}</div>
                                </div>
                                ${getStatusBadge(s.Status)}
                            </div>
                            
                            <div class="res-label">Course Name</div>
                            <div class="res-value small-font">${s["Course Name"]}</div>

                            <div class="row">
                                <div class="col-sm-6"><div class="res-label">Year and Batch</div><div class="res-value">${s["Year and Batch"]}</div></div>
                                <div class="col-sm-6"><div class="res-label">MIS Number</div><div class="res-value">${s["MIS Number"]}</div></div>
                            </div>
                             <div class="row">
                                <div class="col-sm-6"><div class="res-label">NIC</div><div class="res-value">${s.NIC}</div></div>
                                <div class="col-sm-6"><div class="res-label">Finger Print ID</div><div class="res-value">${s["Finger Print ID"] || 'N/A'}</div></div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6"><div class="res-label">Certificate Number</div><div class="res-value">${s["Certificate Number"] || 'N/A'}</div></div>
                                <div class="col-sm-6"><div class="res-label">Back Serial Number</div><div class="res-value">${s["Back Serial Number"] || 'N/A'}</div></div>
                            </div>
                             <div class="row">
                                <div class="col-sm-6"><div class="res-label">Effective Date</div><div class="res-value">${s["Affective Date"] || 'N/A'}</div></div>
                            </div>
                        </div>`;
                });
                area.innerHTML = html;
            } else {
                area.innerHTML = `<div class="alert alert-danger mt-4 text-center animate__animated animate__shakeX">NIC not found in records. Please check the number and try again.</div>`;
            }
            nicInput.value = ""; // Clear input for next search
        }, 250); 
    }
